name: Taskboard CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          python-version: '3.14.10'
          enable-cache: false

      - name: Install the locked dependencies
        run: |
          uv sync --locked --extra websocket --group lint
          npm --prefix web ci --no-audit --no-fund

      - name: Build the web app
        run: npm --prefix web run build

      - name: Lint Python, JavaScript and HTML
        run: |
          uv run --no-sync ruff check .
          npm --prefix web run lint

      - name: Check clean package installs
        run: uv run --no-sync python -B tools/check_package_installs.py

      - name: Run Python tests
        run: uv run --no-sync python -B -W error::ResourceWarning tools/test_python.py

      - name: Run Node tests
        working-directory: web
        run: node --test

      - name: Verify the public workflow snapshot
        run: uv run --no-sync python -B tools/generate_demo_workflow.py --check

      - name: Check a disposable mount
        run: uv run --no-sync python -B -m unittest discover -s tools/release/checks -p test_release_smoke.py

      - name: Check synthetic server and client compatibility
        run: |
          test -f tools/release/test_release_compatibility.py
          uv run --no-sync python -B -m unittest discover -s tools/release -p test_release_compatibility.py

      - name: Check the staged app with the launcher and pinned fixtures
        run: |
          git fetch --no-tags --depth=1 origin "$(cat tools/release/supported-runner.txt)"
          uv run --no-sync python -B -W error::ResourceWarning -m unittest discover -s tools/release -p test_installed_runner.py

      - name: Test local deployment with disposable inputs
        run: |
          test -f tools/release/test_direct_main.py
          uv run --no-sync python -B -m unittest discover -s tools/release -p test_direct_main.py
          uv run --no-sync python -B -W error::ResourceWarning -m unittest discover -s tools/release -p test_release_slots.py

      - name: Run the OpenID Connect fixture tests
        run: |
          uv sync --locked --extra websocket --extra oidc
          uv run --no-sync python -B -W error::ResourceWarning tools/test_python.py --require-no-skips test_tasks_oidc

  postgres-preferences:
    name: SQLite and PostgreSQL preference replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857 # 16.16
        env:
          POSTGRES_DB: taskboard_test
          POSTGRES_USER: taskboard_test
          POSTGRES_PASSWORD: taskboard_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U taskboard_test -d taskboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          python-version: '3.14.10'
          enable-cache: false

      - name: Install the locked PostgreSQL driver
        run: uv sync --locked --extra postgres

      - name: Replay notification preferences on both engines
        env:
          TASKBOARD_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: >-
          env PYTHONPATH=. uv run --no-sync python -B -W error::ResourceWarning -m unittest
          discover -s tools/ci -p test_notification_preferences.py
