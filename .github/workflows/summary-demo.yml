name: Publish Summary demo

on:
  workflow_dispatch:
  schedule:
    - cron: '17 17 * * *'

permissions:
  contents: read

concurrency:
  group: taskboard-summary-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      deployments: read
    outputs:
      publish: ${{ steps.publish.outputs.ready }}
      revision: ${{ steps.publish.outputs.revision }}
    env:
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - id: checked
        env:
          DEMO_GITHUB_READ_TOKEN: ${{ github.token }}
        run: python3 tools/demo-publication/checked_main.py
      - if: steps.checked.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - id: previous
        if: steps.checked.outputs.current == 'true' && github.event_name == 'schedule'
        env:
          DEMO_GITHUB_READ_TOKEN: ${{ github.token }}
        run: python3 tools/demo-publication/content_fingerprint.py previous
      - if: steps.checked.outputs.current == 'true'
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build:demo
          python3 tools/build_pages.py web/dist-demo web/pages "$RUNNER_TEMP/taskboard-pages"
      - id: content
        if: steps.checked.outputs.current == 'true'
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha256 }}
          PREVIOUS_URL: ${{ steps.previous.outputs.url }}
        run: |
          args=()
          if [[ -n "$PREVIOUS_REVISION" && -z "$PREVIOUS_SHA" ]]; then
            # Older checked deployments predate the public digest.
            baseline=$(mktemp -d "$RUNNER_TEMP/pages-legacy.XXXXXX")
            git fetch --no-tags --depth=1 origin "$PREVIOUS_REVISION"
            git archive "$PREVIOUS_REVISION" | tar -x -C "$baseline"
            npm --prefix "$baseline/web" ci --no-audit --no-fund
            npm --prefix "$baseline/web" run build:demo
            python3 "$baseline/tools/build_pages.py" "$baseline/web/dist-demo" "$baseline/web/pages" "$baseline/pages"
            args=(--legacy-package "$baseline/pages" --legacy-url "$PREVIOUS_URL")
          fi
          python3 tools/demo-publication/content_fingerprint.py compare \
            "$RUNNER_TEMP/taskboard-pages" "$REVISION" --previous "$PREVIOUS_SHA" "${args[@]}"
      - id: smoke
        if: steps.content.outputs.changed == 'true'
        run: |
          web/node_modules/.bin/playwright install --with-deps --only-shell chromium webkit
          node tools/demo-visual/check.mjs --dist web/dist-demo --output "$RUNNER_TEMP/pages-smoke"
      - if: always() && steps.content.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: summary-pages-smoke
          path: ${{ runner.temp }}/pages-smoke
          if-no-files-found: ignore
      - id: publish
        if: steps.smoke.outcome == 'success' && steps.content.outputs.changed == 'true'
        run: printf 'ready=true\nrevision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"
      - if: steps.content.outputs.changed == 'false'
        run: echo 'Homepage and demo match the last verified Pages deployment.' >> "$GITHUB_STEP_SUMMARY"
      - if: steps.publish.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/taskboard-pages

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: fresh
        env:
          REVISION: ${{ needs.build.outputs.revision }}
          DEMO_GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          branch=$(curl --fail --silent --show-error --max-time 15 \
              --header "Authorization: Bearer $DEMO_GITHUB_READ_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main")
          if jq -e --arg revision "$REVISION" \
              '.name == "main" and .protected == true and .commit.sha == $revision' <<< "$branch"; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped publication because the protected main revision changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: publish
        if: steps.fresh.outputs.current == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
