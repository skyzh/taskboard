name: Taskboard demo comparison

on:
  pull_request:

permissions:
  contents: read

jobs:
  compare:
    name: Compare public demo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - id: compare
        uses: ./.github/actions/compare-summary-demo
        with:
          baseline-ref: ${{ github.event.pull_request.base.sha }}
      - id: evidence
        if: steps.compare.outputs.status == 'changed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: summary-demo-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/demo-evidence/baseline/
            ${{ runner.temp }}/demo-evidence/candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Bind the evidence to the receipt
        if: steps.evidence.outputs.artifact-id != ''
        env:
          EVIDENCE_ID: ${{ steps.evidence.outputs.artifact-id }}
          EVIDENCE_DIR: ${{ runner.temp }}/demo-evidence
        run: python3 tools/demo-publication/receipt.py --link-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.compare.outcome != 'skipped'
        with:
          name: summary-demo-comparison-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-evidence/receipt.json
          if-no-files-found: error
          retention-days: 14
