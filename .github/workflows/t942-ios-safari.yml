name: T-942 iOS Safari capture

on:
  push:
    branches: [agent/prism/t942-ios-safari]

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Build the disposable board
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          shasum -a 256 -c tools/t942-safari/frontend.sha256
      - name: Capture the synthetic ticket in Safari
        env:
          CAPTURE_SOURCE: 081d40949de296edac6d7d997f08e21ca257e9f7
        run: bash tools/t942-safari/capture.sh "$RUNNER_TEMP/t942" "$CAPTURE_SOURCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: t942-ios-safari
          path: ${{ runner.temp }}/t942/evidence/
          retention-days: 7
