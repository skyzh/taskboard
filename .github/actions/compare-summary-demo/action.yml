name: Compare the Taskboard demo
description: Build and replay the currently checked out demo against the approved commit
inputs:
  baseline-ref:
    description: Base revision to read for a pull request. Defaults to the checked-out revision.
    required: false
  candidate-dist:
    description: Static candidate built on a separate runner, when provided
    required: false
outputs:
  status:
    description: pass, changed, unavailable, privacy_failed, or error
    value: ${{ steps.compare.outputs.status }}
runs:
  using: composite
  steps:
    - id: compare
      shell: bash
      env:
        BASELINE_REF: ${{ inputs.baseline-ref }}
        CANDIDATE_DIST: ${{ inputs.candidate-dist }}
        EVIDENCE: ${{ runner.temp }}/demo-evidence
      run: bash tools/demo-publication/compare.sh
