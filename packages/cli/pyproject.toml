[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "taskboard-cli"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["taskboard-client==0.1.0"]

[project.optional-dependencies]
offline = ["taskboard-server==0.1.0"]

[project.scripts]
tasks = "taskboard_cli:main"
