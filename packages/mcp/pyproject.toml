[project]
name = "taskboard-mcp"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["taskboard-client==0.1.0", "mcp==2.0.0"]

[project.scripts]
taskboard-mcp = "taskboard_mcp:main"
